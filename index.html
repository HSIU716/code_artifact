  <!-- Firebase 雲端自動同步模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const isAvailable = typeof __firebase_config !== 'undefined';
    if (isAvailable) {
      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        window.__cloudStore = {
          app,
          auth,
          db,
          appId,
          doc,
          getDoc,
          setDoc,
          onSnapshot,
          signIn: async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              return await signInWithCustomToken(auth, __initial_auth_token);
            }
            return await signInAnonymously(auth);
          }
        };
      } catch (e) {
        console.warn("Cloud store initialization skipped", e);
      }
    }
  </script>

        try {
          // 1. 同步更新至網址錨點，重整網頁或將網址分享給旅伴都能即時開啟相同行程
          const encoded = btoa(encodeURIComponent(JSON.stringify(newTrip)));
          window.history.replaceState(null, "", `#${encoded}`);
        } catch (e) {
          console.warn("URL persistence error", e);
        }

        // 2. 若支援雲端同步，則自動備份至專屬雲端空間
        if (window.__cloudStore && user) {
          const { db, appId, doc, setDoc } = window.__cloudStore;
          try {
            const tripDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'trips', 'activeTrip');
            await setDoc(tripDocRef, {
              trip: newTrip,
              updatedAt: Date.now()
            });
            setCloudStatus("雲端已同步");
          } catch (err) {
            console.warn("Cloud persistence err", err);
          }
        }
      };

      // 監聽雲端儲存與使用者授權狀態
      useEffect(() => {
        if (!window.__cloudStore) return;
        const { auth, signIn, db, appId, doc, onSnapshot } = window.__cloudStore;
        let unsubscribeDoc = null;

        signIn().then((cred) => {
          const user = cred?.user || auth.currentUser;
          if (!user) return;
          setCurrentUser(user);

          const tripDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'trips', 'activeTrip');
          unsubscribeDoc = onSnapshot(tripDocRef, (snapshot) => {
            if (snapshot.exists()) {
              const data = snapshot.data();
              if (data && data.trip && Array.isArray(data.trip.days)) {
                setTripData(data.trip);
                setCloudStatus("雲端已同步");
              }
            }
          }, (err) => {
            console.debug("Cloud sync snapshot error:", err);
          });
        }).catch(err => {
          console.debug("Cloud auth error:", err);
        });

        return () => {
          if (unsubscribeDoc) unsubscribeDoc();

                let cleaned = textResponse.trim();
                if (cleaned.startsWith("```json")) {
                  cleaned = cleaned.replace(/^```json\s*/i, "").replace(/\s*```$/, "");
                } else if (cleaned.startsWith("```")) {

                }

                resultJson = JSON.parse(cleaned);
                if (resultJson && Array.isArray(resultJson.days) && resultJson.days.length > 0) {
                  success = true;
                  break;
                }
              }
            } catch (err) {
              lastErrorMessage = err.message || "網路連線異常";
              if (attempt < 2) {
                await new Promise(r => setTimeout(r, (attempt + 1) * 1500));
              }
            }
          }
        }

          setTripData(resultJson);
          saveTripPersistence(resultJson, currentUser);
          setActiveDayIndex(0);
          setActiveCategory('all');

                        value={plannerForm.daysCount}
                        onChange={(e) => setPlannerForm({ ...plannerForm, daysCount: Number(e.target.value) })}
                        className="w-full px-3 py-2 bg-white border border-[#D5C7B2] rounded-xl text-stone-800 font-medium focus:ring-2 focus:ring-amber-500 focus:outline-hidden"
                      >
                        {[1, 2, 3, 4, 5, 6, 7].map(n => (
                          <option key={n} value={n}>{n} 天</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="font-bold text-stone-700 block mb-1">
                        👥 成員組成
                      </label>
                      <select
                        value={plannerForm.companion}
                        onChange={(e) => setPlannerForm({ ...plannerForm, companion: e.target.value })}
                        className="w-full px-3 py-2 bg-white border border-[#D5C7B2] rounded-xl text-stone-800 font-medium focus:ring-2 focus:ring-amber-500 focus:outline-hidden"
                      >
                        <option value="情侶 / 夫妻蜜月">甜蜜情侶 / 夫妻</option>
                        <option value="家庭親子 (含長輩或兒童)">溫馨家庭親子遊</option>
                        <option value="三五好友自駕團">三五好友熱血自駕</option>
                        <option value="獨自背包客冒險">獨行背包客探險</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-stone-700 block mb-1">
                      💰 預算期待
                    </label>
                    <select
                      value={plannerForm.budget}
                      onChange={(e) => setPlannerForm({ ...plannerForm, budget: e.target.value })}
                      className="w-full px-3 py-2 bg-white border border-[#D5C7B2] rounded-xl text-stone-800 font-medium focus:ring-2 focus:ring-amber-500 focus:outline-hidden"
                    >
                      <option value="親民小資高CP值 (約 NT$ 25,000 / 人)">經濟小資高CP值</option>
                      <option value="精緻舒適中高預算 (約 NT$ 45,000 / 人)">精緻舒適無負擔</option>
                      <option value="頂級奢華享受 (約 NT$ 80,000+ / 人)">頂級奢華美饌住宿</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-stone-700 block mb-1">
                      🎨 旅行風格與偏好
                    </label>
                    <textarea
                      rows={2}
                      value={plannerForm.stylePreference}
                      onChange={(e) => setPlannerForm({ ...plannerForm, stylePreference: e.target.value })}
                      placeholder="例如：喜歡米其林私房料理、不要太趕..."
                      className="w-full px-3 py-2 bg-white border border-[#D5C7B2] rounded-xl text-stone-800 font-medium focus:ring-2 focus:ring-amber-500 focus:outline-hidden"
                    />
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    disabled={isGenerating}
                    onClick={handleGenerateAiTrip}
                    className={`w-full py-3 rounded-2xl font-extrabold text-xs text-white shadow-lg transition-all flex items-center justify-center gap-2 ${
                      isGenerating
                        ? 'bg-stone-400 cursor-not-allowed'
                        : 'bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 hover:opacity-95 active:scale-98'
                    }`}
                  >
                    {isGenerating ? (
                      <>
                        <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />
                        <span>Gemini AI 正深度繪製手帳中，請稍候...</span>
                      </>
                    ) : (
                      <>
                        <SketchSparkles className="w-4 h-4 text-amber-200" />
                        <span>開始繪製專屬手繪行程 (Gemini AI)</span>
                      </>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast 提示 */}
          {toastMessage && (
            <div className="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-stone-900/90 text-white text-xs font-bold rounded-full shadow-2xl backdrop-blur-sm border border-stone-700 flex items-center gap-2">
              <span>✨</span>
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 行程卡片 Component
    // ==========================================
    function ItineraryCard({ item, onNavigate, onOpenStory, onCopyCode }) {
      const typeConfig = {
        attraction: {
          badge: "景點名勝",
          badgeBg: "bg-sky-100 text-sky-900 border-sky-300",
          cardBorder: "border-[#E2D8C6] hover:border-sky-400",
          icon: <SketchAttraction className="w-4 h-4 text-sky-700" />
        },
        food: {
          badge: "私房美饌",
          badgeBg: "bg-orange-100 text-orange-950 border-orange-300",
          cardBorder: "border-[#E5D7C2] hover:border-orange-400",
          icon: <SketchFood className="w-4 h-4 text-orange-700" />
        },
        transport: {
          badge: "自駕交通",
          badgeBg: "bg-purple-100 text-purple-950 border-purple-300",
          cardBorder: "border-[#E1D6C5] hover:border-purple-400",
          icon: <SketchCar className="w-4 h-4 text-purple-700" />
        },
        hotel: {
          badge: "特色下榻",
          badgeBg: "bg-emerald-100 text-emerald-950 border-emerald-300",
          cardBorder: "border-[#E0D8C6] hover:border-emerald-400",
          icon: <SketchHotel className="w-4 h-4 text-emerald-700" />
        }
      };

      const config = typeConfig[item.type] || typeConfig.attraction;

      return (
        <div className={`relative bg-white/95 rounded-2xl p-3.5 border-2 ${config.cardBorder} shadow-xs transition-all duration-200`}>
          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center space-x-2">
              <span className="font-mono text-xs font-black text-amber-900 bg-amber-100/70 px-2 py-0.5 rounded-md border border-amber-200">
                {item.time}
              </span>
              <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${config.badgeBg} flex items-center gap-1`}>
                {config.icon}
                <span>{config.badge}</span>
              </span>
              {item.duration && (
                <span className="text-[10px] text-stone-400 font-medium">⏱️ {item.duration}</span>
              )}
            </div>

            {item.bookingCode && (
              <button
                onClick={(e) => onCopyCode(item.bookingCode, e)}
                className="group flex items-center space-x-1 px-2 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border border-indigo-300 rounded-md text-[10px] font-mono font-bold shadow-2xs transition-all active:scale-95"
                title="點擊複製代號"
              >
                <span>🔑</span>
                <span className="underline decoration-indigo-300">{item.bookingCode}</span>
                <span className="text-[9px] opacity-70 group-hover:opacity-100">📋</span>
              </button>
            )}
          </div>

          <div className="mt-2">
            <h3 className="text-sm font-extrabold text-stone-900 leading-snug">
              {item.title}
            </h3>
            <p className="text-xs text-stone-600 mt-1 leading-relaxed">
              {item.description}
            </p>
          </div>

          {/* 亮點標籤區 */}
          <div className="mt-2.5 pt-2 border-t border-dashed border-stone-200/90 flex flex-wrap gap-1.5">
            {item.mustEat && item.mustEat.map((food, i) => (
              <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 bg-rose-50 text-rose-800 border border-rose-300/80 rounded-lg text-[11px] font-black shadow-2xs">
                <span>🍜 必吃：</span>
                <span>{food}</span>
              </span>
            ))}

            {item.mustOrder && item.mustOrder.map((menu, i) => (
              <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 bg-amber-50 text-amber-900 border border-amber-300/80 rounded-lg text-[11px] font-black shadow-2xs">
                <span>📝 必點：</span>
                <span>{menu}</span>
              </span>
            ))}

            {item.mustBuy && item.mustBuy.map((souvenir, i) => (
              <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 bg-emerald-50 text-emerald-900 border border-emerald-300/80 rounded-lg text-[11px] font-black shadow-2xs">
                <span>🎁 必買：</span>
                <span>{souvenir}</span>
              </span>
            ))}
          </div>

          {/* 底部導航與故事 */}
          <div className="mt-3 flex items-center justify-between gap-2 pt-1">
            <div className="flex items-center text-[11px] text-stone-500 font-medium truncate">
              <span className="text-stone-400 mr-1">📍</span>
              <span className="truncate">{item.locationName}</span>
            </div>

            <div className="flex items-center space-x-1.5 shrink-0">
              {item.storyAndTips && (
                <button
                  onClick={onOpenStory}
                  className="px-2.5 py-1 bg-amber-100/80 hover:bg-amber-200 text-amber-900 rounded-xl text-[11px] font-bold border border-amber-300 flex items-center gap-1 transition-all active:scale-95"
                >
                  <span>📖</span>
                  <span>攻略故事</span>
                </button>
              )}

              <button
                onClick={onNavigate}
                className="px-3 py-1 bg-stone-900 hover:bg-stone-800 text-[#FAF7F2] rounded-xl text-[11px] font-bold shadow-xs flex items-center gap-1 transition-all active:scale-95"
              >
                <SketchPin className="w-3.5 h-3.5 text-amber-300" />
                <span>導航</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 渲染至網頁 DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
