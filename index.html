  <!-- Firebase 雲端自動同步模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const isAvailable = typeof __firebase_config !== 'undefined';
    if (isAvailable) {
      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        window.__cloudStore = {
          app,
          auth,
          db,
          appId,
          doc,
          getDoc,
          setDoc,
          onSnapshot,
          signIn: async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              return await signInWithCustomToken(auth, __initial_auth_token);
            }
            return await signInAnonymously(auth);
          }
        };
      } catch (e) {
        console.warn("Cloud store initialization skipped", e);
      }
    }
  </script>

    const copyTextToClipboard = (text) => {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const success = document.execCommand('copy');
        document.body.removeChild(textarea);

請務必精準試算【預估航程時間 (flightEstimate)】與各站【交通/航程時間 (transitTime)】，並完整輸出從第 1 天到第 ${targetDays} 天的精彩詳細行程！`;

        const apiPayload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: { 
            responseMimeType: "application/json",
            maxOutputTokens: 8192
          }
        };

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        let success = false;
        let resultJson = null;
        let lastErrorMessage = "";

        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(apiPayload)
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => null);
              const errMsg = errData?.error?.message || `HTTP ${response.status}`;
              if (response.status === 400 && (errMsg.includes("API key") || !apiKey)) {
                lastErrorMessage = "若在 GitHub Pages 等外部網站執行，請在設定中填入您的 Gemini API Key";
              } else if (response.status === 403 || response.status === 401) {
                lastErrorMessage = "API Key 無效或尚未在 Google Cloud 啟用 Generative Language API";
              } else if (response.status === 429) {
                lastErrorMessage = "超出 Google 呼叫頻率限制 (Quota exceeded)，請稍後再試";
              } else {
                lastErrorMessage = errMsg;
              }
              throw new Error(lastErrorMessage);
            }

            const data = await response.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (textResponse) {
              let cleaned = textResponse.trim();
              if (cleaned.startsWith("```json")) {
                cleaned = cleaned.replace(/^```json\s*/i, "").replace(/\s*```$/, "");
              } else if (cleaned.startsWith("```")) {
                cleaned = cleaned.replace(/^```\s*/, "").replace(/\s*```$/, "");
              }

              resultJson = JSON.parse(cleaned);
              if (resultJson && Array.isArray(resultJson.days) && resultJson.days.length > 0) {
                resultJson.daysCount = resultJson.days.length;
                success = true;
                break;
              }
            }
          } catch (err) {
            lastErrorMessage = err.message || "網路連線異常";
            if (attempt < 2) {
              await new Promise(r => setTimeout(r, (attempt + 1) * 1500));
            }
          }
        }

        setIsGenerating(false);

          saveTripPersistence(resultJson, profile, checkedItemIds, userMemos, currentUser);
          setActiveDayIndex(0);

                      </button>
                      <button
                        onClick={() => fileInputRef.current && fileInputRef.current.click()}
                        className="py-2 px-3 bg-white border border-amber-300 text-amber-900 font-bold rounded-xl active:scale-98"
                      >
                        匯入檔案
                      </button>
                    </div>
                  </div>

                  {/* 選項 C：LZ-String 壓縮分享連結 */}
                  <div className="bg-white p-3.5 rounded-2xl border border-stone-200/90 shadow-2xs space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-extrabold text-stone-900 text-xs flex items-center gap-1.5">
                        <span>🔗</span> 方法三：LZ 壓縮專用連結
                      </span>
                      <span className="text-[10px] text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded-md font-bold border border-indigo-200">
                        已減肥 75%
                      </span>
                    </div>
                    <p className="text-[11px] text-stone-600">
                      採用 LZ-String 演算法大幅壓縮，朋友在電腦或手機點開網址即可直接閱讀。
                    </p>
                    <div className="flex items-center gap-1.5">
                      <input
                        type="text"
                        readOnly
                        value={window.location.href}
                        className="flex-1 p-1.5 bg-stone-100 border border-stone-200 rounded-lg text-stone-500 font-mono text-[10px] truncate"
                      />
                      <button
                        onClick={() => {
                          copyTextToClipboard(window.location.href);
                          triggerToast("💌 已成功複製壓縮網址！");
                        }}
                        className="px-3 py-1.5 bg-stone-900 text-white font-bold rounded-lg text-xs shrink-0 active:scale-95"
                      >
                        複製
                      </button>
                    </div>
                  </div>
                </div>

                <div className="pt-1">
                  <button
                    onClick={() => setShowShareModal(false)}
                    className="w-full py-2.5 bg-stone-200 text-stone-700 font-extrabold text-xs rounded-2xl hover:bg-stone-300"
                  >
                    關閉
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 隱藏的檔案上傳輸入框 */}
          <input
            type="file"
            ref={fileInputRef}
            onChange={handleImportFileChange}
            accept=".json"
            className="hidden"
          />

          {/* Toast 提示 */}
          {toastMessage && (
            <div className="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-stone-900/90 text-white text-xs font-bold rounded-full shadow-2xl backdrop-blur-sm border border-stone-700 flex items-center gap-2">
              <span>✨</span>
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 行程卡片 Component
    // ==========================================
    function ItineraryCard({ item, isChecked, onToggleCheck, memo, onSaveMemo, onNavigate, onOpenStory, onCopyCode }) {
      const [showMemoInput, setShowMemoInput] = useState(Boolean(memo));
      const [memoText, setMemoText] = useState(memo || "");

      const typeConfig = {
        attraction: {
          badge: "景點名勝",
          badgeBg: "bg-sky-100 text-sky-900 border-sky-300",
          cardBorder: "border-[#E2D8C6] hover:border-sky-400",
          icon: <SketchAttraction className="w-4 h-4 text-sky-700" />
        },
        food: {
          badge: "私房美饌",
          badgeBg: "bg-orange-100 text-orange-950 border-orange-300",
          cardBorder: "border-[#E5D7C2] hover:border-orange-400",
          icon: <SketchFood className="w-4 h-4 text-orange-700" />
        },
        transport: {
          badge: "自駕交通",
          badgeBg: "bg-purple-100 text-purple-950 border-purple-300",
          cardBorder: "border-[#E1D6C5] hover:border-purple-400",
          icon: <SketchCar className="w-4 h-4 text-purple-700" />
        },
        hotel: {
          badge: "特色下榻",
          badgeBg: "bg-emerald-100 text-emerald-950 border-emerald-300",
          cardBorder: "border-[#E0D8C6] hover:border-emerald-400",
          icon: <SketchHotel className="w-4 h-4 text-emerald-700" />
        }
      };

      const config = typeConfig[item.type] || typeConfig.attraction;

      return (
        <div className={`relative bg-white/95 rounded-2xl p-3.5 border-2 ${isChecked ? 'border-rose-300 bg-rose-50/20' : config.cardBorder} shadow-xs transition-all duration-200`}>
          
          {/* 已踩點手繪印章高光 */}
          {isChecked && (
            <div className="absolute top-2 right-2 z-10 pointer-events-none animate-in zoom-in-50 duration-150">
              <SketchStamp />
            </div>
          )}

          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center space-x-2">
              <span className="font-mono text-xs font-black text-amber-900 bg-amber-100/70 px-2 py-0.5 rounded-md border border-amber-200">
                {item.time}
              </span>
              <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${config.badgeBg} flex items-center gap-1`}>
                {config.icon}
                <span>{config.badge}</span>
              </span>
              {item.duration && (
                <span className="text-[10px] text-stone-400 font-medium">⏱️ {item.duration}</span>
              )}
            </div>

            <div className="flex items-center gap-1">
              {item.bookingCode && (
                <button
                  onClick={(e) => onCopyCode(item.bookingCode, e)}
                  className="group flex items-center space-x-1 px-2 py-0.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border border-indigo-300 rounded-md text-[10px] font-mono font-bold shadow-2xs transition-all active:scale-95"
                  title="點擊複製代號"
                >
                  <span>🔑</span>
                  <span className="underline decoration-indigo-300">{item.bookingCode}</span>
                  <span className="text-[9px] opacity-70 group-hover:opacity-100">📋</span>
                </button>
              )}

              {/* 踩點印章切換按鈕 */}
              <button
                onClick={onToggleCheck}
                title={isChecked ? "取消踩點" : "蓋上已踩點印章"}
                className={`px-2 py-0.5 rounded-md text-[10px] font-bold border transition-all active:scale-90 ${
                  isChecked
                    ? 'bg-rose-100 text-rose-800 border-rose-300'
                    : 'bg-stone-100 hover:bg-stone-200 text-stone-600 border-stone-200'
                }`}
              >
                {isChecked ? '💮 已踩點' : '⚪ 打卡'}
              </button>
            </div>
          </div>

          <div className="mt-2">
            <h3 className={`text-sm font-extrabold leading-snug ${isChecked ? 'text-stone-700 line-through opacity-85' : 'text-stone-900'}`}>
              {item.title}
            </h3>
            <p className="text-xs text-stone-600 mt-1 leading-relaxed">
              {item.description}
            </p>
          </div>

          {/* 預估航行 / 交通時間提示標籤 */}
          {item.transitTime && (
            <div className="mt-2 flex items-center gap-1.5 text-[11px] font-bold text-sky-900 bg-sky-50 border border-sky-200/80 px-2 py-1 rounded-lg shadow-2xs">
              <span className="text-xs">⏱️</span>
              <span>{item.transitTime}</span>
            </div>
          )}

          {/* 亮點標籤區 */}
          <div className="mt-2.5 pt-2 border-t border-dashed border-stone-200/90 flex flex-wrap gap-1.5">
            {item.mustEat && item.mustEat.map((food, i) => (
              <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 bg-rose-50 text-rose-800 border border-rose-300/80 rounded-lg text-[11px] font-black shadow-2xs">
                <span>🍜 必吃：</span>
                <span>{food}</span>
              </span>
            ))}

            {item.mustOrder && item.mustOrder.map((menu, i) => (
              <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 bg-amber-50 text-amber-900 border border-amber-300/80 rounded-lg text-[11px] font-black shadow-2xs">
                <span>📝 必點：</span>
                <span>{menu}</span>
              </span>
            ))}

            {item.mustBuy && item.mustBuy.map((souvenir, i) => (
              <span key={i} className="inline-flex items-center gap-1 px-2 py-0.5 bg-emerald-50 text-emerald-900 border border-emerald-300/80 rounded-lg text-[11px] font-black shadow-2xs">
                <span>🎁 必買：</span>
                <span>{souvenir}</span>
              </span>
            ))}
          </div>

          {/* 旅人私人筆記便籤 (隨手記) */}
          <div className="mt-2">
            {showMemoInput ? (
              <div className="bg-amber-50/70 border border-dashed border-amber-300 rounded-xl p-2 text-xs space-y-1">
                <div className="flex items-center justify-between text-[10px] text-amber-900 font-bold">
                  <span>✍️ 我的私人手帳備忘：</span>
                  <button
                    type="button"
                    onClick={() => {
                      if (!memoText.trim()) setShowMemoInput(false);
                    }}
                    className="text-stone-400 hover:text-stone-700"
                  >
                    ✕
                  </button>
                </div>
                <textarea
                  rows={2}
                  value={memoText}
                  onChange={(e) => setMemoText(e.target.value)}
                  onBlur={() => onSaveMemo(memoText)}
                  placeholder="隨手記下你的私房備忘（例如：要買抹茶捲給媽媽、門票只收現金...）"
                  className="w-full p-1.5 bg-white border border-amber-200 rounded-lg text-stone-800 text-xs focus:outline-hidden focus:ring-1 focus:ring-amber-500"
                />
              </div>
            ) : (
              <button
                type="button"
                onClick={() => setShowMemoInput(true)}
                className="text-[10px] text-stone-600 hover:text-amber-800 font-bold flex items-center gap-1 py-0.5"
              >
                <span>✍️</span>
                <span className="underline decoration-dotted">新增這站的私人備忘筆記</span>
              </button>
            )}
          </div>

          {/* 底部導航與故事 */}
          <div className="mt-2.5 flex items-center justify-between gap-2 pt-1 border-t border-stone-100">
            <div className="flex items-center text-[11px] text-stone-500 font-medium truncate">
              <span className="text-stone-400 mr-1">📍</span>
              <span className="truncate">{item.locationName}</span>
            </div>

            <div className="flex items-center space-x-1.5 shrink-0">
              {item.storyAndTips && (
                <button
                  onClick={onOpenStory}
                  className="px-2.5 py-1 bg-amber-100/80 hover:bg-amber-200 text-amber-900 rounded-xl text-[11px] font-bold border border-amber-300 flex items-center gap-1 transition-all active:scale-95"
                >
                  <span>📖</span>
                  <span>攻略故事</span>
                </button>
              )}

              <button
                onClick={onNavigate}
                className="px-3 py-1 bg-stone-900 hover:bg-stone-800 text-[#FAF7F2] rounded-xl text-[11px] font-bold shadow-xs flex items-center gap-1 transition-all active:scale-95"
              >
                <SketchPin className="w-3.5 h-3.5 text-amber-300" />
                <span>導航</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 渲染至網頁 DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
